<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - {{ nome_profissional }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Esconde o Sidebar na hora de imprimir, para imprimir só o conteúdo do iframe */
        @media print {
            #sidebar { display: none !important; }
            #main-content { margin-left: 0 !important; width: 100% !important; }
            iframe { height: 100vh !important; }
        }
    </style>
</head>
<body class="bg-slate-100 flex h-screen overflow-hidden font-sans text-slate-800">

    <!-- Sidebar Lateral -->
    <aside id="sidebar" class="w-72 bg-slate-900 text-white flex flex-col shadow-2xl z-20 transition-all duration-300">
        <div class="p-6 bg-slate-950 border-b border-slate-800">
            <span class="text-[10px] font-black tracking-widest text-indigo-400 uppercase">Profissional em Análise</span>
            <h2 class="text-lg font-black text-white mt-1 leading-tight">{{ nome_profissional }}</h2>
            <div class="mt-3 flex gap-2">
                <span class="px-2 py-1 bg-slate-800 text-slate-300 text-[10px] rounded font-bold border border-slate-700">ID: {{ id_profissional }}</span>
                <span class="px-2 py-1 bg-indigo-900 text-indigo-200 text-[10px] rounded font-bold border border-indigo-700">ACS</span>
            </div>
        </div>

        <nav class="flex-1 overflow-y-auto p-4 flex flex-col gap-2">
            <p class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2 mt-2">Visão Executiva</p>
            <button onclick="carregarRelatorio('relatorio_executivo', this)" class="menu-btn w-full flex items-center gap-3 px-4 py-3 bg-indigo-600 text-white rounded-lg shadow font-semibold text-sm transition-all hover:bg-indigo-500">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                Painel de Conformidade
            </button>

            <p class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2 mt-4">Auditoria e Território</p>
            <button onclick="carregarRelatorio('matriz_serie_historica', this)" class="menu-btn w-full flex items-center gap-3 px-4 py-3 bg-slate-800 text-slate-300 rounded-lg font-medium text-sm transition-all hover:bg-slate-700 hover:text-white">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                Matriz Histórica
            </button>
            <button onclick="carregarRelatorio('cadastros_territoriais', this)" class="menu-btn w-full flex items-center gap-3 px-4 py-3 bg-slate-800 text-slate-300 rounded-lg font-medium text-sm transition-all hover:bg-slate-700 hover:text-white">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                Perfil Cadastral
            </button>
            <button onclick="carregarRelatorio('visitas_domiciliares', this)" class="menu-btn w-full flex items-center gap-3 px-4 py-3 bg-slate-800 text-slate-300 rounded-lg font-medium text-sm transition-all hover:bg-slate-700 hover:text-white">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                Boletim de Visitas
            </button>
        </nav>

        <div class="p-4 border-t border-slate-800">
            <a href="/busca" class="flex justify-center items-center gap-2 w-full py-2 bg-slate-800 hover:bg-rose-700 text-white rounded font-bold text-sm transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 15l-3-3m0 0l3-3m-3 3h8M3 12a9 9 0 1118 0 9 9 0 01-18 0z"></path></svg>
                Trocar Profissional
            </a>
        </div>
    </aside>

    <!-- Área de Conteúdo Principal (Iframe) -->
    <main id="main-content" class="flex-1 relative bg-slate-200">
        <!-- O Iframe carrega a rota original de relatório, mantendo toda a lógica intacta -->
        <iframe id="report-frame" src="/relatorio/{{ id_profissional }}?tipo=relatorio_executivo&nome={{ nome_profissional | urlencode }}" class="w-full h-full border-none"></iframe>
    </main>

    <script>
        function carregarRelatorio(tipo, btnClicado) {
            // Atualiza botões
            document.querySelectorAll('.menu-btn').forEach(btn => {
                btn.className = "menu-btn w-full flex items-center gap-3 px-4 py-3 bg-slate-800 text-slate-300 rounded-lg font-medium text-sm transition-all hover:bg-slate-700 hover:text-white";
            });
            btnClicado.className = "menu-btn w-full flex items-center gap-3 px-4 py-3 bg-indigo-600 text-white rounded-lg shadow font-semibold text-sm transition-all hover:bg-indigo-500";
            
            // Atualiza Iframe
            const frame = document.getElementById('report-frame');
            frame.src = `/relatorio/{{ id_profissional }}?tipo=${tipo}&nome={{ nome_profissional | urlencode }}`;
        }
    </script>
</body>
</html>
