<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Painel e-SUS - Busca Dinâmica</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            .dropdown-scroll::-webkit-scrollbar {
                width: 8px;
            }

            .dropdown-scroll::-webkit-scrollbar-thumb {
                background-color: #cbd5e1;
                border-radius: 4px;
            }
        </style>
    </head>
    <body class="bg-slate-50 min-h-screen p-10 font-sans">
        <div class="max-w-2xl mx-auto bg-white p-8 rounded-lg shadow-md border border-slate-200">
            <div class="text-center mb-8 border-b border-slate-100 pb-6">
                <span class="text-xs font-black tracking-widest text-indigo-600 uppercase">Secretaria de Saúde</span>
                <h1 class="text-3xl font-black text-slate-900 mt-1 tracking-tight">Inteligência e-SUS PEC</h1>
            </div>
            <div class="relative">
                <label for="input-busca"
                       class="block text-sm font-semibold text-slate-700 mb-2">
                    Nome do Profissional (Digite ao menos 5 letras):
                </label>
                <input type="text"
                       id="input-busca"
                       autocomplete="off"
                       placeholder="Ex: Nome do Profissional"
                       class="w-full border border-slate-300 rounded-md shadow-sm p-4 text-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                <div id="dropdown"
                     class="absolute z-20 w-full mt-2 bg-white border border-slate-200 rounded-md shadow-xl hidden">
                    <ul id="lista-resultados"
                        class="max-h-64 overflow-y-auto dropdown-scroll">
                    </ul>
                    <div id="status-busca"
                         class="p-3 text-sm text-slate-500 text-center font-medium bg-slate-50 hidden">Buscando...</div>
                    <div id="paginacao"
                         class="border-t border-slate-100 p-2 text-center bg-slate-50 hidden rounded-b-md">
                        <button type="button"
                                id="btn-carregar-mais"
                                class="w-full text-sm text-indigo-600 hover:text-indigo-800 hover:bg-indigo-100 font-semibold py-2 rounded transition-colors">
                            Exibir mais resultados
                        </button>
                    </div>
                </div>
            </div>
            <div id="feedback-selecao"
                 class="mt-8 p-6 bg-slate-50 border border-slate-200 rounded-xl hidden shadow-inner">
                <span class="text-[10px] font-black tracking-widest text-indigo-500 uppercase">Profissional Localizado</span>
                <p id="nome-selecionado"
                   class="text-slate-900 font-black text-2xl mt-0.5 mb-2"></p>
                <div class="flex flex-wrap gap-2 mb-6">
                    <span id="id-selecionado"
                          class="bg-white text-slate-600 text-xs font-bold px-3 py-1 rounded border border-slate-200"></span>
                    <span id="grupos-selecionado"
                          class="bg-indigo-50 text-indigo-700 text-xs font-bold px-3 py-1 rounded border border-indigo-200"></span>
                </div>
                <div class="border-t border-slate-200 pt-5">
                    <a href="#"
                       id="btn-acessar-dashboard"
                       class="flex items-center justify-center gap-3 w-full p-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg shadow-md transition-all duration-200 font-bold text-lg group">
                        Abrir Dashboard Executivo
                        <svg class="w-6 h-6 transform group-hover:translate-x-1 transition-transform"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2"
                             viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path>
                        </svg>
                    </a>
                    <p class="text-center text-xs text-slate-500 mt-3">Acesso integrado a todos os relatórios do profissional</p>
                </div>
            </div>
        </div>
        <script>
            const inputBusca = document.getElementById('input-busca');
            const dropdown = document.getElementById('dropdown');
            const listaResultados = document.getElementById('lista-resultados');
            const statusBusca = document.getElementById('status-busca');
            const containerPaginacao = document.getElementById('paginacao');
            const btnCarregarMais = document.getElementById('btn-carregar-mais');
            const feedbackBox = document.getElementById('feedback-selecao');
            const btnDashboard = document.getElementById('btn-acessar-dashboard');

            let debounceTimer;
            let paginaAtual = 1;
            let termoAtual = '';
            let carregando = false;

            inputBusca.addEventListener('input', (e) => {
                clearTimeout(debounceTimer);
                const termo = e.target.value.trim();

                feedbackBox.classList.add('hidden');

                if (termo.length < 5) {
                    dropdown.classList.add('hidden');
                    return;
                }

                debounceTimer = setTimeout(() => {
                    termoAtual = termo;
                    paginaAtual = 1;
                    listaResultados.innerHTML = '';
                    dispararBuscaAPI(true);
                }, 400);
            });

            btnCarregarMais.addEventListener('click', () => {
                paginaAtual++;
                dispararBuscaAPI(false);
            });

            async function dispararBuscaAPI(novaBusca) {
                if (carregando) return;

                carregando = true;
                dropdown.classList.remove('hidden');

                if (novaBusca) {
                    statusBusca.classList.remove('hidden');
                    statusBusca.textContent = "Buscando no banco de dados...";
                    containerPaginacao.classList.add('hidden');
                } else {
                    btnCarregarMais.textContent = "Carregando...";
                    btnCarregarMais.disabled = true;
                }

                try {
                    const resposta = await fetch(`/api/relatorios/profissionais?q=${encodeURIComponent(termoAtual)}&page=${paginaAtual}&size=10`);
                    const dados = await resposta.json();

                    statusBusca.classList.add('hidden');

                    if (dados.itens.length === 0 && novaBusca) {
                        statusBusca.classList.remove('hidden');
                        statusBusca.textContent = "Nenhum profissional encontrado.";
                        return;
                    }

                    dados.itens.forEach(prof => {
                        const li = document.createElement('li');
                        li.className = "cursor-pointer p-3 hover:bg-indigo-50 border-b border-slate-100 last:border-0 transition-colors";

                        const grupoTag = prof.grupos.length > 0 ?
                            `<span class="inline-block bg-indigo-100 text-indigo-800 text-[10px] font-bold px-2 py-0.5 rounded mr-1">${prof.grupos[0]}</span>` :
                            `<span class="inline-block bg-slate-100 text-slate-600 text-[10px] font-bold px-2 py-0.5 rounded">Sem Perfil</span>`;

                        li.innerHTML = `
                    <div class="font-medium text-slate-800">${prof.nome}</div>
                    <div class="mt-1">${grupoTag}</div>
                `;

                        li.addEventListener('click', () => {
                            inputBusca.value = prof.nome;
                            dropdown.classList.add('hidden');

                            feedbackBox.classList.remove('hidden');
                            document.getElementById('nome-selecionado').textContent = prof.nome;
                            document.getElementById('id-selecionado').textContent = `ID Neon: ${prof.id_profissional}`;
                            document.getElementById('grupos-selecionado').textContent = `Perfis: ${prof.grupos.join(' | ')}`;

                            // Aponta para a nova rota centralizadora (Sidebar + Iframe)
                            btnDashboard.href = `/dashboard/${prof.id_profissional}?nome=${encodeURIComponent(prof.nome)}`;
                        });

                        listaResultados.appendChild(li);
                    });

                    if (paginaAtual < dados.total_paginas) {
                        containerPaginacao.classList.remove('hidden');
                        btnCarregarMais.textContent = `Exibir mais resultados (Página ${paginaAtual + 1})`;
                        btnCarregarMais.disabled = false;
                    } else {
                        containerPaginacao.classList.add('hidden');
                    }

                } catch (error) {
                    statusBusca.classList.remove('hidden');
                    statusBusca.textContent = "Erro de conexão com a API.";
                } finally {
                    carregando = false;
                }
            }

            document.addEventListener('click', (e) => {
                if (!inputBusca.contains(e.target) && !dropdown.contains(e.target)) {
                    dropdown.classList.add('hidden');
                }
            });
        </script>
    </body>
</html>
