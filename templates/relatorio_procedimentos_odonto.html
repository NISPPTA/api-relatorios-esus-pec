<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Procedimentos Odontológicos Especializados</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            @page {
                size: portrait;
                margin: 10mm;
            }

            @media print {
                body {
                    background-color: white !important;
                    padding: 0 !important;
                }

                .no-print {
                    display: none !important;
                }

                .print-shadow-none {
                    box-shadow: none !important;
                    border: none !important;
                    padding: 0 !important;
                }

                .avoid-break {
                    break-inside: avoid;
                    page-break-inside: avoid;
                    -webkit-column-break-inside: avoid;
                }
            }

            .watermark {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%) rotate(-35deg);
                font-size: 5rem;
                font-weight: 900;
                color: rgba(15, 23, 42, 0.04);
                white-space: nowrap;
                pointer-events: none;
                z-index: -1;
                text-align: center;
                line-height: 1.2;
            }
        </style>
    </head>
    <body class="bg-slate-50 p-6 font-sans text-slate-800 relative z-0">
        <div class="watermark">
            FONTE OFICIAL: E-SUS PEC
            <br>
            <span style="font-size: 3rem;">PRODUÇÃO SIGTAP</span>
        </div>
        <!-- Barra de Filtros -->
        <div class="max-w-5xl mx-auto bg-white p-4 rounded-lg shadow mb-6 border border-slate-200 no-print">
            <form id="form-filtros"
                  class="grid grid-cols-1 md:grid-cols-4 gap-3 items-end">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Ano</label>
                    <input type="number"
                           id="input-ano"
                           value="{{ filtro_ano }}"
                           min="2020"
                           max="2030"
                           class="w-full border border-slate-300 rounded px-3 py-1.5 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Mês Início</label>
                    <select id="select-mes-inicio"
                            class="w-full border border-slate-300 rounded px-3 py-1.5 text-sm">
                        <option value="1">Jan (01)</option>
                        <option value="2">Fev (02)</option>
                        <option value="3">Mar (03)</option>
                        <option value="4">Abr (04)</option>
                        <option value="5">Mai (05)</option>
                        <option value="6">Jun (06)</option>
                        <option value="7">Jul (07)</option>
                        <option value="8">Ago (08)</option>
                        <option value="9">Set (09)</option>
                        <option value="10">Out (10)</option>
                        <option value="11">Nov (11)</option>
                        <option value="12">Dez (12)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Mês Fim</label>
                    <select id="select-mes-fim"
                            class="w-full border border-slate-300 rounded px-3 py-1.5 text-sm">
                        <option value="1">Jan (01)</option>
                        <option value="2">Fev (02)</option>
                        <option value="3">Mar (03)</option>
                        <option value="4">Abr (04)</option>
                        <option value="5">Mai (05)</option>
                        <option value="6">Jun (06)</option>
                        <option value="7">Jul (07)</option>
                        <option value="8">Ago (08)</option>
                        <option value="9">Set (09)</option>
                        <option value="10">Out (10)</option>
                        <option value="11">Nov (11)</option>
                        <option value="12">Dez (12)</option>
                    </select>
                </div>
                <div>
                    <button type="submit"
                            class="w-full bg-indigo-700 hover:bg-indigo-800 text-white font-bold py-1.5 px-3 rounded text-sm transition-colors shadow">
                        Atualizar Indicadores
                    </button>
                </div>
            </form>
        </div>
        <!-- Relatório -->
        <div class="max-w-5xl mx-auto bg-white p-10 rounded-lg shadow-lg print-shadow-none border border-slate-200">
            <div class="flex justify-between items-start border-b-2 border-indigo-800 pb-4 mb-6">
                <div>
                    <span class="text-xs font-extrabold tracking-widest text-indigo-800 uppercase">Sistema Único de Saúde - Atenção Primária</span>
                    <h1 class="text-2xl font-black text-slate-900 mt-1 uppercase tracking-tight">Procedimentos Odontológicos Especializados</h1>
                    <p class="text-sm text-slate-600 mt-1">
                        Profissional: <strong class="text-slate-900">{{ nome_profissional }}</strong> |
                        Período: <span id="lbl-periodo" class="font-medium text-slate-900">...</span>
                    </p>
                </div>
                <button type="button"
                        onclick="window.print()"
                        class="no-print bg-indigo-700 hover:bg-indigo-800 text-white font-bold py-2 px-4 rounded text-sm inline-flex items-center shadow gap-2">
                    <svg class="w-4 h-4"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z">
                        </path>
                    </svg>
                    Imprimir PDF
                </button>
            </div>
            <div id="loading" class="text-center py-10">
                <p class="text-indigo-700 font-bold animate-pulse">Consolidando matriz SIGTAP...</p>
            </div>
            <div id="conteudo-relatorio" style="display: none;">
                <!-- KPIs Globais -->
                <div class="grid grid-cols-2 gap-4 mb-8 avoid-break">
                    <div class="p-4 bg-indigo-50 border-l-4 border-indigo-600 rounded shadow-sm">
                        <span class="text-[10px] font-black text-indigo-800 uppercase tracking-widest">Total de Procedimentos Realizados</span>
                        <p id="kpi-total" class="text-4xl font-black text-slate-900 mt-1">0</p>
                    </div>
                    <div class="p-4 bg-slate-50 border-l-4 border-slate-500 rounded shadow-sm">
                        <span class="text-[10px] font-black text-slate-600 uppercase tracking-widest">Tipos Distintos Executados (SIGTAP)</span>
                        <p id="kpi-distintos" class="text-4xl font-black text-slate-800 mt-1">0</p>
                    </div>
                </div>
                <!-- Container Dinâmico das Categorias -->
                <div id="container-categorias"
                     class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Gerado via JS -->
                </div>
            </div>
        </div>
        <script>
            const idProfissional = Number("{{ id_profissional }}");

            document.getElementById('select-mes-inicio').value = "{{ filtro_mes_inicio }}";
            document.getElementById('select-mes-fim').value = "{{ filtro_mes_fim }}";

            const configCores = {
                "prevencao": "teal",
                "dentistica": "blue",
                "periodontia": "emerald",
                "cirurgia": "rose",
                "endodontia": "amber",
                "outros": "slate"
            };

            async function carregarDados() {
                const ano = document.getElementById('input-ano').value;
                const mesIn = document.getElementById('select-mes-inicio').value;
                const mesFim = document.getElementById('select-mes-fim').value;

                document.getElementById('lbl-periodo').textContent = `Mês ${mesIn} a ${mesFim} de ${ano}`;
                document.getElementById('loading').style.display = 'block';
                document.getElementById('conteudo-relatorio').style.display = 'none';

                try {
                    const resp = await fetch(`/api/relatorios/profissionais/${idProfissional}/procedimentos-odonto?ano=${ano}&mes_inicio=${mesIn}&mes_fim=${mesFim}`);
                    const data = await resp.json();

                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('conteudo-relatorio').style.display = 'block';

                    document.getElementById('kpi-total').textContent = data.resumo.total_procedimentos;
                    document.getElementById('kpi-distintos').textContent = data.resumo.total_tipos_distintos;

                    const container = document.getElementById('container-categorias');
                    container.innerHTML = '';

                    // Renderiza cada categoria
                    Object.entries(data.categorias).forEach(([chave, catData]) => {
                        if (catData.total === 0) return; // Oculta blocos vazios

                        const cor = configCores[chave] || "slate";

                        const card = document.createElement('div');
                        card.className = `bg-white border-t-4 border-${cor}-500 rounded shadow-sm border border-slate-200 p-4 avoid-break`;

                        const cabecalho = document.createElement('div');
                        cabecalho.className = "flex justify-between items-end border-b border-slate-100 pb-2 mb-3";
                        const titulo = document.createElement('h3');
                        titulo.className = `text-xs font-black text-${cor}-800 uppercase tracking-widest`;
                        titulo.textContent = catData.titulo;
                        const totalCategoria = document.createElement('span');
                        totalCategoria.className = "text-xs font-black text-slate-500";
                        totalCategoria.textContent = `Total: ${catData.total}`;
                        cabecalho.append(titulo, totalCategoria);

                        const lista = document.createElement('div');
                        lista.className = "flex flex-col";
                        catData.itens.sort((a, b) => b.quantidade - a.quantidade).forEach(item => {
                            const pct = data.resumo.total_procedimentos > 0 ? ((item.quantidade / data.resumo.total_procedimentos) * 100).toFixed(1) : "0.0";
                            const linha = document.createElement('div');
                            linha.className = "flex justify-between items-center py-2 border-b border-slate-100 last:border-0 hover:bg-slate-50";

                            const descricao = document.createElement('div');
                            descricao.className = "flex flex-col flex-1 pr-3";
                            const nomeProcedimento = document.createElement('span');
                            nomeProcedimento.className = "text-[11px] font-bold text-slate-700 leading-tight";
                            nomeProcedimento.textContent = item.procedimento;
                            const codigoProcedimento = document.createElement('span');
                            codigoProcedimento.className = "text-[9px] font-mono text-slate-400 mt-0.5";
                            codigoProcedimento.textContent = `SIGTAP: ${item.codigo_sigtap}`;
                            descricao.append(nomeProcedimento, codigoProcedimento);

                            const valores = document.createElement('div');
                            valores.className = "flex items-center gap-2 shrink-0";
                            const percentual = document.createElement('span');
                            percentual.className = "text-[9px] font-bold text-slate-400 bg-white border border-slate-200 py-0.5 rounded w-10 text-center inline-block";
                            percentual.textContent = `${pct}%`;
                            const quantidade = document.createElement('span');
                            quantidade.className = `text-xs font-black text-${cor}-800 bg-${cor}-100 py-0.5 rounded shadow-sm w-10 text-center inline-block`;
                            quantidade.textContent = item.quantidade;
                            valores.append(percentual, quantidade);
                            linha.append(descricao, valores);
                            lista.appendChild(linha);
                        });
                        card.append(cabecalho, lista);
                        container.appendChild(card);
                    });

                } catch (e) {
                    console.error(e);
                    document.getElementById('loading').innerHTML = '<p class="text-rose-600 font-bold">Erro ao carregar dados do SIGTAP.</p>';
                }
            }
            document.getElementById('form-filtros').addEventListener('submit', (e) => {
                e.preventDefault();
                carregarDados();
            });
            document.addEventListener('DOMContentLoaded', carregarDados);
        </script>
    </body>
</html>
