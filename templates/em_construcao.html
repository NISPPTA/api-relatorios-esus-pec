<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Módulo em Construção</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6 font-sans">
    <div class="max-w-md w-full bg-white p-8 rounded-lg shadow-md border border-gray-200 text-center">
        <div class="w-14 h-14 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        </div>
        <h2 class="text-xl font-bold text-gray-800">Módulo em Desenvolvimento</h2>
        <p class="text-sm text-gray-600 mt-2">
            O relatório selecionado (<strong>{{ tipo_relatorio }}</strong>) para <strong>{{ nome_profissional }}</strong> está na fase seguinte do roadmap de engenharia de dados.
        </p>
        <div class="mt-6">
            <a href="/busca" class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm px-5 py-2.5 rounded shadow transition-colors">
                Voltar à Busca
            </a>
        </div>
    </div>
</body>
</html>
