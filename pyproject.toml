[project]
name = "relatorios-esus-pec"
version = "1.0.0"
description = "API em FastAPI para geração de relatórios de produção do e-SUS PEC"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.110.0",
    "uvicorn[standard]==0.29.0",
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "pydantic-settings==2.2.1",
    "jinja2 (>=3.1.6,<4.0.0)",
    "greenlet (>=3.5.6,<4.0.0)"
]

[tool.poetry]
package-mode = false
[dependency-groups]
dev = [
    "djlint (>=1.49.9,<2.0.0)"
]

[tool.djlint]
profile = "jinja"
ignore = "H030,H031,J018,H021"
format_css = true
format_js = true
indent = 4
